volumes:
  dump_volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: "./data/mine/dump"

  configs_volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: "./data/mine/configs"

  packages_volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: "./data/mine/packages"

  dot_intermine_volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: "./data/mine/intermine"

  mine_volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: "./data/mine/${MINE_NAME}"

  postgres_volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: "./data/postgres"

  solr_volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: "./data/solr"

  bluegenes_volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: "./data/bluegenes_tools"

services:
  intermine_builder:
    container_name: intermine_builder
    build:
      context: ./intermine_builder
      dockerfile: ./intermine_builder.Dockerfile
      args:
        - USER_ID=${DOCKER_UID}
        - GROUP_ID=${DOCKER_GID}
    volumes:
      - dump_volume:/home/intermine/intermine/dump
      - configs_volume:/home/intermine/intermine/configs
      - packages_volume:/home/intermine/.m2
      - dot_intermine_volume:/home/intermine/.intermine
      - mine_volume:/home/intermine/intermine/${MINE_NAME}
    environment:
      - MINE_NAME=${MINE_NAME}
      - MINE_REPO_URL=${MINE_REPO_URL}
      - IM_DATA_DIR=${IM_DATA_DIR}
      - MEM_OPTS=${BUILDER_MEM_OPTS}
      - IM_REPO_URL=${IM_REPO_URL}
      - IM_REPO_BRANCH=${IM_REPO_BRANCH}
      - PGPASSWORD=postgres
    depends_on:
      - postgres
      - solr
      - tomcat

  postgres:
    container_name: intermine_postgres
    build:
      context: ./postgres
      dockerfile: ./postgres.Dockerfile
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data
    ports:
      - ${POSTGRES_HOST_PORT}:${POSTGRES_PORT}

  solr:
    container_name: intermine_solr
    build:
      context: ./solr
      dockerfile: ./solr.Dockerfile
    environment:
      - MEM_OPTS=${SOLR_MEM_OPTS}
      - MINE_NAME=${MINE_NAME}
    volumes:
      - solr_volume:/var/solr
    ports:
      - ${SOLR_HOST_PORT}:${SOLR_PORT}

  tomcat:
    container_name: intermine_tomcat
    build:
      context: ./tomcat
      dockerfile: ./tomcat.Dockerfile
    environment:
      - MEM_OPTS=${TOMCAT_MEM_OPTS}
    ports:
      - ${TOMCAT_HOST_PORT}:${TOMCAT_PORT}

  bluegenes:
    container_name: intermine_bluegenes
    image: intermine/bluegenes:1.4.5-dx
    volumes:
      - bluegenes_volume:/tools
    environment:
      - BLUEGENES_DEFAULT_SERVICE_ROOT="http://localhost:${TOMCAT_HOST_PORT}/cadremine"
      - BLUEGENES_BACKEND_SERVICE_ROOT="http://tomcat:${TOMCAT_PORT}/cadremine"
      - BLUEGENES_DEFAULT_MINE_NAME=CADREMine
      - BLUEGENES_DEFAULT_NAMESPACE=cadremine
